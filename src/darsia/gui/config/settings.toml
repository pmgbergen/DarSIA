
[settings.setup.all]
content = [
    {key = "rig.test.int", type = "int", help = "Enter the test integer value. This parameter controls the intensity level."},
    {key = "rig.test.float", type = "float", help = "Enter the test float value.", link = "https://docs.example.com/float-parameter"},
    {key = "rig.test.string", type = "string", options = ["option1", "option2", "option3"], help = "Select the processing mode. Each option uses different algorithms."},
    {key = "rig.test.bool", type = "bool"},
    {key = "rig.test.fixed_list_string", type = "fixed_list", list_type="string", options = ["item1", "item2", "item3"], help = "Select items to enable. Multiple selections are allowed.", link = "https://docs.example.com/items"},
    {key = "rig.test.fixed_list_int", type = "list", list_type="int"},
    {key = "rig.test.list", type = "list", list_type = "float"},
    {key = "rig.test.single_file", type = "file", help = "Select the configuration file to load."},
    {key = "rig.test.single_folder", type = "folder"},
    {key = "rig.test.multi_file", type = "multi_file", help = "Add one or more input files.", link = "https://docs.example.com/multi-file"}

]

