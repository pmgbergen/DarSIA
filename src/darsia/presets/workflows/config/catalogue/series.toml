# Experiment-series presets: which physical rig a run belongs to.
#
# A series does not restate geometry or crop corners — it references entries in
# the rig and curvature catalogues by name, so those values live in exactly one
# place. Only settings with no catalogue of their own (target_type, depth) are
# given inline here.

[[series_preset]]
name = "BC0xx family"
description = "Bilbo rig, BC0xx experiment series (and B033, same physical setup)."
rig = "FF Bilbo"
curvature = "FF Bilbo (BC0xx)"

[[series_preset]]
name = "B049"
description = "Bilbo rig, B049 experiment series."
rig = "FF Bilbo"
curvature = "FF Bilbo (B049)"
