# ── Build system ──────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=64", "numpy"]
build-backend = "setuptools.build_meta"

# ── Project metadata (replaces setup.py) ──────────────────────────────────────
[project]
name = "darsia"
version = "1.1.0"
description = "Darcy scale image analysis toolbox"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
keywords = ["darcy", "image analysis", "porous media", "flow"]

authors = [
  { name = "Jakub Wiktor Both", email = "jakub.both@uib.no" },
  { name = "Trygve Tegnander" },
  { name = "Enrico Facca" },
  { name = "Erlend Storvik" },
  { name = "Jan Martin Nordbotten" },
]

maintainers = [{ name = "Jakub Wiktor Both", email = "jakub.both@uib.no" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "natsort",
  "numpy",
  "opencv-python",
  "scipy",
  "matplotlib",
  "scikit-image",
  "future",
  "colour-science",
  "colour-checker-detection",
  "ipympl",
  "pillow",
  "scikit-learn",
  "pandas",
  "plotly",
  "largestinteriorrectangle",
  "pydicom",
  "pyamg",
  "shapely",
  "openpyxl",
  "toml",
  "PySide6",
  "qtawesome",
  "psutil",
  "pywin32; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/pmgbergen/DarSIA"
Repository = "https://github.com/pmgbergen/DarSIA.git"
Issues = "https://github.com/pmgbergen/DarSIA/issues"

# ── Entry points ──────────────────────────────────────────────────────────────
[project.gui-scripts]
darsia = "darsia.gui.__main__:main"

[project.scripts]
darsia-install-desktop = "darsia.gui.desktop_integration:main"

# ── Optional dependencies (replaces extras_require in setup.py) ───────────────
[project.optional-dependencies]
dev = [
  "pytest>=7.1",
  "pytest-qt",
  "black==24.10.0",
  "isort",
  "flake8",
  "mypy",
  "numpydoc",
  "meshio",
  "deepdiff",
  "pyamg",
]
docs = [
  "sphinx>=7.2",
  "pydata-sphinx-theme>=0.15",
  "numpydoc",
  "sphinx-gallery",
  "sphinx-design",
  "sphinx-copybutton",
  "myst-nb",
  "pillow",
]
# petsc = ["petsc4py"]

# ── Setuptools package discovery (replaces find_packages in setup.py) ─────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darsia = ["py.typed"]

# ── pytest (migrated from setup.cfg [tool:pytest]) ───────────────────────────
[tool.pytest.ini_options]
python_files = ["tests/*.py"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]
required-version = "24.10.0"

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
skip = ["src/darsia/__init__.py"]

# ── numpydoc docstring linting (advisory CI job "numpydoc-lint") ──────────────
# Run locally with:  uv run numpydoc lint <file(s)>
#
# Started as an explicit allow-list of the checks that flag real problems
# (unknown/undocumented types, mismatched or mis-ordered parameters, bad
# sections). Broaden towards the full NumPy convention over time; the CI job is
# advisory (continue-on-error) until the backlog is worked down.
[tool.numpydoc_validation]
checks = [
  "PR02",  # a documented parameter is not in the signature
  "PR03",  # documented parameters are in the wrong order
  "PR04",  # a parameter has no type
  "PR08",  # parameter description should start with a capital letter
  "PR10",  # missing space before the colon in "name : type"
  "GL06",  # unknown section title
  "GL07",  # sections in the wrong order
]

# ── flake8 does not natively support pyproject.toml; config remains in setup.cfg
