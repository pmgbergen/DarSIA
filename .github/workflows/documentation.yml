name: Documentation

on:
  push:
    branches:
      - dev
  pull_request:

# Allow the deploy job to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; do not cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and doc dependencies
        run: pip install -e ".[docs]"

      - name: Build documentation
        run: sphinx-build -b html --keep-going docs docs/_build/html

      # TODO(step 6): fold back into the build above once the docstring
      # migration to NumPy style has cleared the outstanding reST warnings.
      - name: Build documentation, warnings as errors (advisory)
        continue-on-error: true
        run: sphinx-build -b html -W --keep-going docs docs/_build/html_strict

      - name: Check external links (advisory)
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: Run doctests (advisory)
        continue-on-error: true
        run: sphinx-build -b doctest docs docs/_build/doctest

      - name: Disable Jekyll on GitHub Pages
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
