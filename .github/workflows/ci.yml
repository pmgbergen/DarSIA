name: Build test

on:
  push:
    branches:
     - main
     - dev
  pull_request:
    branches:
     - main
     - dev

#  schedule:
    # Do a nightly run of the tests
#    - cron: '0 1 * * *'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.12"
        architecture: x64

    - name: Install static analysis tools
      run: pip install black==24.10.0 flake8 isort

    - name: black
      run: black --check src

    - name: flake8
      run: flake8 src

    - name: isort
      run: isort --check src

  pytest-without-petsc:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v2

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Install DarSIA
      run: pip install .[dev]

    - name: pytest
      run: pytest

  pytest-with-petsc:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v2

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install petsc dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhypre-dev libmumps-seq-dev
        pip install numpy mpi4py
        PETSC_CONFIGURE_OPTIONS="--download-hypre --download-mumps --download-parmetis --download-ml --download-metis --download-scalapack" pip install petsc petsc4py

    - name: Install DarSIA (with petsc, push only)
      if: github.event_name == 'push'
      run: uv sync --extra dev

    - name: Install DarSIA
      if: github.event_name != 'push'
      run: uv sync --extra dev

